<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>task 01</title>

    <style>
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #0f2bb4;
        padding: 10px;
        color: white;
      }

       a,
      li {
        display: inline;
        color: white;
        margin-right: 10px;
      }

      .form {
        background-color: #0aa0f0;
        padding: 20px;
        border: 1px solid #ccc;
        color: #fff;
      }

     
    </style>

  </head>

  <body>


    <!-- HEADER FOR THIS PAGE  -->
    <header class="header">
     <img src="../images/ioc-logo.jpg" alt="" width="50" height="50" />
      <nav>
        <ul style="list-style-type: none">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="../task-02/task-02.html">task 02</a></li>
        </ul>
    </header>
    <h1 style="text-align: center;">Student Registeration</h1>


    <!-- student record form -->
    <form class="form">
      <!-- name -->
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />
      <br /><br />

      <!-- email -->
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />
      <br /><br />

      <!-- profile picture -->
      <label for="profile-picture">Profile Picture:</label>
      <input type="file" id="profile-picture" name="profile-picture" accept="image/*" required />
      <br /><br />



      <!-- marks list dropdown -->
      <label for="marks">Marks List:</label>
      <select id="marks" name="marks" required>
        <option value="">Select Marks</option>
        <option value="50">50</option>
        <option value="49">49</option>
        <option value="50">50</option>
        <option value="39">39</option>
        <option value="20">20</option>
      </select>
      <br /><br />

      <!-- gender -->
      <label for="gender">Gender:</label>
      <input type="radio" id="male" name="gender" value="male" required />
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female" required />
      <label for="female">Female</label>
      <br /><br />


      <!-- submit date  -->
      <label for="date">Date:</label>
      <input type="date" id="date" name="date" required />
      <br /><br />

      <!-- select program -->
      <label for="program">Program:</label>
      <select id="program" name="program" required>
        <option value="">Select Program</option>
        <option value="CS">BS CS</option>
        <option value="AI">BS AI</option>
        <option value="DS">BS DS</option>
        <option value="CGS">BS CGS</option>
        <option value="SE">BS SE</option>
      </select>
      <br /><br />

      <!-- submit button -->
      <input type="submit" value="Submit" />

    </form>


  </body>

</html>
