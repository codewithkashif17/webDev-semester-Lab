<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      header {
        background-color: #222;
        color: white;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 450px;
        margin: 50px auto;
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      h2 {
        text-align: center;
        margin-top: 0;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .remember {
        margin-top: 15px;
      }

      .remember input {
        width: auto;
      }

      .btn {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        background-color: #222;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .btn:hover {
        background-color: #444;
      }

      .links {
        text-align: center;
        margin-top: 15px;
      }

      .links a {
        text-decoration: none;
        color: #222;
      }

      .links a:hover {
        text-decoration: underline;
      }

      footer {
        text-align: center;
        background-color: #222;
        color: white;
        padding: 15px;
        margin-top: 40px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>User Login Form</h1>
    </header>

    <div class="container">
      <h2>Login</h2>

      <form>
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />

        <div class="remember">
          <input type="checkbox" id="remember" name="remember" />

          <label for="remember"> Remember Me </label>
        </div>

        <button type="submit" class="btn">Login</button>
      </form>

      <div class="links">
        <p>
          <a href="#">Forgot Password?</a>
        </p>

        <p>
          Don't have an account?
          <a href="/Forms/form-01/registration-form.html"> Register Here </a>
        </p>
      </div>
    </div>

    <footer>Web Development Course - Login Form</footer>
  </body>
</html>
