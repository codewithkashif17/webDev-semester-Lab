<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
      }

      header {
        background-color: #222;
        color: white;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 800px;
        margin: 30px auto;
        background-color: white;
        padding: 25px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      h2 {
        margin-top: 0;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }

      .rating input,
      .recommend input {
        width: auto;
        margin-right: 5px;
      }

      .btn {
        margin-top: 20px;
        background-color: #222;
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 5px;
        cursor: pointer;
      }

      .btn:hover {
        background-color: #444;
      }

      footer {
        text-align: center;
        background-color: #222;
        color: white;
        padding: 15px;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Course Feedback Form</h1>
    </header>

    <div class="container">
      <h2>Student Feedback</h2>

      <form>
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter Your Name"
          required
        />

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@gmail.com"
          required
        />

        <label for="course">Course Name</label>
        <select id="course" name="course" required>
          <option value="">Select Course</option>
          <option>HTML</option>
          <option>CSS</option>
          <option>JavaScript</option>
          <option>Web Development</option>
        </select>

        <label>Rate This Course</label>

        <div class="rating">
          <input type="radio" id="excellent" name="rating" value="Excellent" />
          <label for="excellent">Excellent</label>

          <input type="radio" id="good" name="rating" value="Good" />
          <label for="good">Good</label>

          <input type="radio" id="average" name="rating" value="Average" />
          <label for="average">Average</label>

          <input type="radio" id="poor" name="rating" value="Poor" />
          <label for="poor">Poor</label>
        </div>

        <label>Would You Recommend This Course?</label>

        <div class="recommend">
          <input type="radio" id="yes" name="recommend" value="Yes" />
          <label for="yes">Yes</label>

          <input type="radio" id="no" name="recommend" value="No" />
          <label for="no">No</label>
        </div>

        <label for="comments">Comments / Suggestions</label>

        <textarea
          id="comments"
          name="comments"
          rows="5"
          placeholder="Write your feedback here..."
        ></textarea>

        <button type="submit" class="btn">Submit Feedback</button>
      </form>
    </div>

    <footer>Web Development Course - Feedback Form</footer>
  </body>
</html>
